services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: drinkexchange
      POSTGRES_PASSWORD: drinkexchange
      POSTGRES_DB: drinkexchange
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drinkexchange"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
